name: punch-sing-readme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/punch-sing-readme.yml'
permissions:
  contents: write
jobs:
  punch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace README with hosted exact file
        run: |
          set -euo pipefail
          curl -fsSL -o README.md \
            "https://raw.githubusercontent.com/nanoodlecom/nanoodle/cursor/tmp-readme-host-21ce/awesome-noodles-README.md"
          test "$(wc -c < README.md)" -gt 30000
          grep -q "Fushimi Inari at 3:17am" README.md
      - name: Commit README
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "no readme change"
            exit 0
          fi
          git commit -m "Punch sing README: Fushimi Inari 3am omikuji share link"
          git push
